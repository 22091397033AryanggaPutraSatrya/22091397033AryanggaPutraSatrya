<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikat - Portofolio Aryangga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-dark': '#070F2B',
                        'secondary-dark': '#1B1A55',
                        'accent-purple': '#535C91',
                        'accent-light': '#9290C3',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-primary-dark text-gray-200 font-sans antialiased flex flex-col min-h-screen">

    <div id="header-container"></div>

    <!-- Konten Utama -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div class="mb-12">
            <h1 class="text-4xl font-bold text-white mb-4">Sertifikat Profesional</h1>
            <p class="text-gray-400">Daftar sertifikasi dan pelatihan yang telah saya selesaikan.</p>
        </div>

        <!-- Wadah Sertifikat (Diisi oleh Javascript) -->
        <div id="sertifikat-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <!-- Modal Viewer Gambar Fullscreen -->
    <div id="imageModal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-sm flex flex-col items-center justify-center p-4" onclick="closeImageModal()">
        <div class="relative max-w-5xl w-full max-h-[90vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
            <!-- Tombol Close -->
            <button onclick="closeImageModal()" class="absolute -top-10 right-0 text-white hover:text-accent-light text-4xl font-bold transition-colors focus:outline-none" aria-label="Tutup Modalan">
                &times;
            </button>
            <!-- Gambar Full Size -->
            <img id="fullImage" src="" alt="Sertifikat Full" class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl border border-accent-purple/40">
            <!-- Deskripsi Singkat Gambar -->
            <p id="imageCaption" class="text-gray-300 text-center mt-4 text-sm font-medium tracking-wide"></p>
        </div>
    </div>

    <div id="footer-container"></div>

    <!-- Script Data Sertifikat -->
    <script src="sertifikat.js"></script>

    <script>
        async function loadComponents() {
            // 1. Muat Header & Footer
            const [headerRes, footerRes] = await Promise.all([
                fetch('header.html').then(res => res.text()),
                fetch('footer.html').then(res => res.text())
            ]);

            document.getElementById('header-container').innerHTML = headerRes;
            document.getElementById('footer-container').innerHTML = footerRes;

            // 2. Event Menu Mobile
            const btn = document.getElementById('mobile-menu-btn');
            const menu = document.getElementById('mobile-menu');
            if (btn && menu) {
                btn.addEventListener('click', () => {
                    menu.classList.toggle('hidden');
                });
            }

            // 3. Aktifkan menu sesuai URL halaman saat ini
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll(`a[href="${currentPage}"]`).forEach(link => {
                if (link.closest('#mobile-menu')) {
                    link.className = "block px-3 py-2 rounded-md text-base font-medium bg-accent-purple/20 text-accent-light";
                } else if (link.closest('nav')) {
                    link.className = "text-accent-light font-semibold border-b-2 border-accent-light px-1 py-2 transition duration-300";
                }
            });
        }

        // Fungsi Render Sertifikat
        function renderSertifikat() {
            const container = document.getElementById('sertifikat-container');
            let html = '';

            sertifikatData.forEach(cert => {
                let idHtml = cert.id ? `<p class="text-gray-400 text-xs mb-4">${cert.id}</p>` : '';
                let skillHtml = cert.skill ? `<div class="mt-auto"><span class="bg-accent-purple/30 text-accent-light border border-accent-purple/50 text-xs font-semibold px-3 py-1 rounded-full">${cert.skill}</span></div>` : '';

                html += `
                <div class="bg-secondary-dark rounded-xl overflow-hidden hover:-translate-y-2 transition duration-300 border border-accent-purple/30 hover:border-accent-light/50 hover:shadow-xl hover:shadow-accent-purple/20 flex flex-col group">
                    <div class="relative overflow-hidden cursor-pointer" onclick="openImageModal('${cert.image}', '${cert.title} - ${cert.issuer}')">
                        <img src="${cert.image}" alt="${cert.title} - ${cert.issuer}" class="w-full h-48 object-cover bg-gray-800 transition-transform duration-500 group-hover:scale-105">
                        <div class="absolute inset-0 bg-primary-dark/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                            <span class="bg-accent-purple/90 text-white text-xs font-semibold px-3 py-1.5 rounded-full backdrop-blur-sm flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg>
                                Perbesar
                            </span>
                        </div>
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <h2 class="text-xl font-bold text-white mb-1">${cert.title}</h2>
                        <p class="text-gray-400 text-sm mb-2">${cert.issuer}</p>
                        <p class="text-accent-light text-sm mb-4 font-medium">${cert.period}</p>
                        ${idHtml}
                        ${skillHtml}
                    </div>
                </div>`;
            });
            
            container.innerHTML = html;
        }

        // Buka Gambar Fullscreen
        function openImageModal(src, title) {
            const modal = document.getElementById('imageModal');
            const fullImg = document.getElementById('fullImage');
            const caption = document.getElementById('imageCaption');

            fullImg.src = src;
            fullImg.alt = title;
            caption.innerText = title;

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Tutup Gambar Fullscreen
        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Tombol Esc untuk menutup modal
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeImageModal();
            }
        });

        // Jalankan
        loadComponents();
        renderSertifikat();
    </script>
</body>
</html>
