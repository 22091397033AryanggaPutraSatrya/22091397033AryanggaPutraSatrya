<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek - Portofolio Aryangga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-dark': '#070F2B',
                        'secondary-dark': '#1B1A55',
                        'accent-purple': '#535C91',
                        'accent-light': '#9290C3',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#070F2B] text-gray-200 font-sans antialiased flex flex-col min-h-screen">

    <!-- Wadah Header -->
    <div id="header-container"></div>

    <!-- Konten Utama -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-16 w-full">
        <div class="mb-12">
            <h1 class="text-4xl font-bold text-white mb-4">Proyek Saya</h1>
            <p class="text-gray-400">Beberapa karya dan sistem yang telah saya kembangkan.</p>
        </div>

        <!-- Wadah Daftar Proyek (Akan diisi oleh Javascript) -->
        <div id="projek-container" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </main>

    <!-- Wadah Footer -->
    <div id="footer-container"></div>

    <!-- Modal Proyek -->
    <div id="projectModal" class="fixed inset-0 z-50 hidden bg-black/80 flex items-center justify-center p-4">
        <div class="bg-[#1B1A55] rounded-xl max-w-3xl w-full p-5 sm:p-6 relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-[#9290C3] hover:text-white text-3xl font-bold leading-none z-10">&times;</button>
            <h2 id="modalTitle" class="text-xl sm:text-2xl font-bold text-white mb-4 pr-8">Judul</h2>
            
            <div class="relative w-full h-48 sm:h-64 md:h-80 bg-[#070F2B] rounded-lg mb-4 flex items-center justify-center border border-[#535C91] overflow-hidden">
                <img id="modalImage" src="" alt="Gambar Proyek" class="max-h-full max-w-full object-contain p-2">
                <button onclick="prevImage()" class="absolute left-2 bg-[#1B1A55]/80 text-white p-2 rounded-full hover:bg-[#535C91] transition">&lt;</button>
                <button onclick="nextImage()" class="absolute right-2 bg-[#1B1A55]/80 text-white p-2 rounded-full hover:bg-[#535C91] transition">&gt;</button>
            </div>
            
            <p id="modalDesc" class="text-gray-300 text-sm md:text-base leading-relaxed mb-5">Deskripsi</p>
            <div id="modalTech" class="flex flex-wrap gap-2 mb-6"></div>
            
            <!-- Tombol GitHub (Tampil Otomatis Jika Ada Link) -->
            <a id="modalGithubBtn" href="#" target="_blank" class="inline-flex items-center justify-center px-5 py-2.5 bg-[#535C91] hover:bg-[#9290C3] text-white hover:text-[#070F2B] text-sm font-semibold rounded-lg transition-colors shadow-lg hidden">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" />
                </svg>
                Lihat Repository
            </a>
        </div>
    </div>

    <!-- Script Data Proyek -->
    <script src="projek.js"></script>

    <!-- Script Memanggil Komponen & Logika Modal -->
    <script>
        async function loadComponents() {
            const [headerRes, footerRes] = await Promise.all([
                fetch('header.html').then(res => res.text()),
                fetch('footer.html').then(res => res.text())
            ]);

            document.getElementById('header-container').innerHTML = headerRes;
            document.getElementById('footer-container').innerHTML = footerRes;

            document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
                document.getElementById('mobile-menu')?.classList.toggle('hidden');
            });

            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll(`a[href="${currentPage}"]`).forEach(link => {
                if (link.closest('#mobile-menu')) {
                    link.className = "block px-3 py-2 rounded-md text-base font-medium bg-accent-purple/20 text-accent-light";
                } else if (link.closest('nav')) {
                    link.className = "text-accent-light font-semibold border-b-2 border-accent-light px-1 py-2 transition duration-300";
                }
            });
        }

        // Fungsi Untuk Merender Kartu Proyek ke HTML
        function renderProjek() {
            const container = document.getElementById('projek-container');
            let html = '';

            for (const [id, project] of Object.entries(projectsData)) {
                let techHtml = '';
                project.tech.forEach(tech => {
                    techHtml += `<span class="bg-[#535C91] text-white text-xs font-semibold px-3 py-1 rounded-full">${tech}</span>`;
                });

                html += `
                <div onclick="openModal('${id}')" class="bg-[#1B1A55] rounded-xl p-6 cursor-pointer transform transition hover:-translate-y-2 hover:shadow-2xl hover:shadow-[#535C91]/30 flex flex-col h-full">
                    <div class="flex justify-between items-start mb-4">
                        <h2 class="text-2xl font-bold text-white">${project.title}</h2>
                        <span class="text-[#9290C3] text-sm whitespace-nowrap ml-2">${project.period}</span>
                    </div>
                    <p class="text-gray-300 text-sm leading-relaxed mb-6 flex-grow">${project.shortDesc}</p>
                    <div class="flex flex-wrap gap-2 mt-auto">
                        ${techHtml}
                    </div>
                </div>`;
            }
            container.innerHTML = html;
        }

        let currentProject = '';
        let currentImageIndex = 0;

        function openModal(id) {
            currentProject = id;
            currentImageIndex = 0;
            const project = projectsData[id];
            
            document.getElementById('modalTitle').innerText = project.title;
            document.getElementById('modalDesc').innerText = project.desc;
            
            const techContainer = document.getElementById('modalTech');
            techContainer.innerHTML = '';
            project.tech.forEach(tech => {
                const span = document.createElement('span');
                span.className = 'bg-[#535C91] text-white text-xs font-semibold px-3 py-1 rounded-full';
                span.innerText = tech;
                techContainer.appendChild(span);
            });

            // Logika Tombol GitHub
            const githubBtn = document.getElementById('modalGithubBtn');
            if (project.github && project.github !== '') {
                githubBtn.href = project.github;
                githubBtn.style.display = 'inline-flex';
            } else {
                githubBtn.style.display = 'none';
            }
            
            updateImageDisplay();
            document.getElementById('projectModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('projectModal').classList.add('hidden');
        }

        function updateImageDisplay() {
            const project = projectsData[currentProject];
            const imgElement = document.getElementById('modalImage');
            imgElement.src = project.images[currentImageIndex];
        }

        function prevImage() {
            const project = projectsData[currentProject];
            currentImageIndex = (currentImageIndex === 0) ? project.images.length - 1 : currentImageIndex - 1;
            updateImageDisplay();
        }

        function nextImage() {
            const project = projectsData[currentProject];
            currentImageIndex = (currentImageIndex === project.images.length - 1) ? 0 : currentImageIndex + 1;
            updateImageDisplay();
        }

        // Jalankan Fungsi
        loadComponents();
        renderProjek();
    </script>
</body>
</html>
